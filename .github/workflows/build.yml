name: Build and GameTests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod and run Minecraft integration tests
        run: ./gradlew --no-daemon build runGametest
      - uses: actions/upload-artifact@v4
        with:
          name: rift-fabric-1.21.1
          path: build/libs/rift-1.0.0.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/reports/tests/
            build/gametest-results.xml
